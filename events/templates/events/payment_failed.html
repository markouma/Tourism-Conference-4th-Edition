{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Failed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #fff3f3;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .error-container {
      text-align: center;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.07);
      max-width: 450px;
      animation: fadeIn 0.6s ease-in-out;
    }

    .error-container h2 {
      font-size: 28px;
      color: #d11149;
      margin-bottom: 20px;
    }

    .error-container p {
      font-size: 16px;
      color: #555;
      margin-bottom: 25px;
    }

    .error-container .btn {
      padding: 10px 20px;
      font-weight: bold;
      background-color: #d11149;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      transition: background-color 0.3s ease;
    }

    .error-container .btn:hover {
      background-color: #a50e39;
    }

    .error-icon {
      font-size: 60px;
      color: #d11149;
      margin-bottom: 15px;
      animation: shake 0.3s ease-in-out infinite alternate;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes shake {
      0% { transform: rotate(-2deg); }
      100% { transform: rotate(2deg); }
    }
  </style>
</head>
<body>

<div class="error-container">
  <div class="error-icon">⚠️</div>
  <h2> Failed</h2>
  <p>
    {% if messages %}
      {% for message in messages %}
        {{ message }}
      {% endfor %}
    {% else %}
      Something went wrong while processing your payment. Please try again.
    {% endif %}
  </p> Contact our ticket purchase contact via <a style="color:rgb(12, 133, 133);" href="https://wa.link/mwu6xk" target="_blank" rel="noopener noreferrer">WhatsApp</a> or
  <a href="{% url 'checkout_router' %}" class="btn">Try Again</a>
</div>

</body>
</html>
