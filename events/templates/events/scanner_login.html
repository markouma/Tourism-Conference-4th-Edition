
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f0f2f5;
    color: #333;
  }

  h3 {
    color: #1a2a44;
    text-align: center;
    margin-top: 20px;
  }
  p {
    text-align: center;
    color: #555;
  }

  form {
    max-width: 400px;
    margin: auto;
    padding: 20px;
    background-color: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
  }

  input[type="text"],
  input[type="password"] {
    width: calc(100% - 20px);
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 4px;
    border: 1px solid #ccc;
  }

  button {
    width: 100%;
    padding: 10px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover {
    background-color: #0056b3;
  }


  </style>


<h3>
Scanner Login
</h3>
<p>
  Please enter your username and password to access the scanner dashboard.
</p>

<form method="POST">
    {% csrf_token %}
    <label>Username:</label>
    <input type="text" name="username" required />
    
    <label>Password:</label>
    <input type="password" name="password" required />
    
    <button type="submit">Login</button>
  </form>
  
  {% if messages %}
    <ul>
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
