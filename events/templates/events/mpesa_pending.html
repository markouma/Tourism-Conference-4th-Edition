{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Waiting for M-Pesa...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f5f5f5;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .status-box {
      background-color: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 450px;
      width: 90%;
    }

    .spinner-border, .error-icon {
      width: 3rem;
      height: 3rem;
      margin: 20px auto;
      display: block;
    }

    .error-icon {
      font-size: 3rem;
      color: #dc3545;
      display: none;
    }

    #status-message {
      font-size: 1.1rem;
      margin-bottom: 20px;
      color: #444;
    }

    .retry-btn {
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="status-box">
  <img src="{% static 'assets/img/mpesas.png' %}" style="width: 160px;" alt="M-Pesa Logo">
  <h4 class="mb-3"> M-Pesa Payment Prompt Sent</h4>
  <p>Please check your phone and enter your M-Pesa PIN to complete the transaction.</p>

  <div id="spinner" class="spinner-border text-success" role="status">
    <span class="visually-hidden">Waiting...</span>
  </div>
  
  <div id="error-icon" style="display:none; font-size: 2.5rem;">😢</div>
  
  <div id="status-message">Awaiting payment confirmation...</div>
  
  <div id="redirect-timer" style="display:none; font-size: 0.9rem; color: #888;"></div>
  
  <button id="retry-btn" class="btn btn-outline-secondary retry-btn" onclick="retryStkPush()">Retry Payment</button>

</div>


<script>
    const orderId = "{{ order.id }}";
    let failureTimeout = null;
    let countdownInterval = null;
    let countdownSeconds = 59;
  
    function checkPaymentStatus() {
        fetch(`/payment_status/${orderId}/`)
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success' || data.paid === true) {
                    window.location.href = `/payment_success/?order_id=${orderId}`;
                } else if (data.status === 'failed') {
                    document.getElementById('status-message').innerText = "❌ Payment failed or timed out.";
                    document.getElementById('spinner').style.display = "none";
                    document.getElementById('error-icon').style.display = "block";
  
                    // Start countdown only once
                    if (!failureTimeout) {
                        const redirectTimer = document.getElementById('redirect-timer');
                        redirectTimer.style.display = "block";
                        redirectTimer.textContent = `Redirecting to homepage in ${countdownSeconds} seconds...`;
  
                        countdownInterval = setInterval(() => {
                            countdownSeconds--;
                            if (countdownSeconds <= 0) {
                                clearInterval(countdownInterval);
                            } else {
                                redirectTimer.textContent = `Redirecting to homepage in ${countdownSeconds} seconds...`;
                                // Add this condition to handle the 15-second mark
                                if (countdownSeconds === 18) {
                                    const retryBtn = document.getElementById('retry-btn');
                                    retryBtn.innerText = "Timed-out";
                                    retryBtn.disabled = true;
                                    retryBtn.classList.remove('btn-outline-secondary');
                                    retryBtn.classList.add('btn-secondary');
                                    const statusMsg = document.getElementById('status-message');
                                    statusMsg.innerText = "You gotta start your purchase afresh!"
                                }
                            }
                        }, 1000);
  
                        failureTimeout = setTimeout(() => {
                            window.location.href = "/";
                        }, countdownSeconds * 1000);
                    }
                }
            })
            .catch(err => console.error(err));
    }
  
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
  
    function retryStkPush() {
        // Cancel auto-redirect and countdown if user retries
        if (failureTimeout) {
            clearTimeout(failureTimeout);
            failureTimeout = null;
        }
        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }
  
        fetch(`/retry_stk/{{ order.id }}/`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCookie('csrftoken'),
            },
        })
        .then(res => res.json())
        .then(data => alert(data.message || 'Retry sent!'))
        .catch(console.error);
    }
  
    setInterval(checkPaymentStatus, 5000);
</script>
  
</body>
</html>
