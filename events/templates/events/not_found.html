{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket Not Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f3f8ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .error-container {
      text-align: center;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.07);
      max-width: 450px;
      animation: fadeIn 0.6s ease-in-out;
    }

    .error-container h2 {
      font-size: 28px;
      color: #1155d1;
      margin-bottom: 20px;
    }

    .error-container p {
      font-size: 16px;
      color: #555;
      margin-bottom: 25px;
    }

    .error-container .btn {
      padding: 10px 20px;
      font-weight: bold;
      background-color: #1155d1;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      transition: background-color 0.3s ease;
    }

    .error-container .btn:hover {
      background-color: #0e47a5;
    }

    .error-icon {
      font-size: 60px;
      color: #1155d1;
      margin-bottom: 15px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="error-container">
  <div class="error-icon">🔍</div>
  <h2>Ticket Not Found</h2>
  <p>
    {% if messages %}
      {% for message in messages %}
        {{ message }}
      {% endfor %}
    {% else %}
      We couldn't find the ticket you're looking for. It may have been expired or the reference is incorrect.
    {% endif %}
  </p>
  <a href="{% url 'home' %}" class="btn">Return Home</a>
</div>

</body>
</html>
