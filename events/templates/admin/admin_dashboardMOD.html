{% load static %}


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Admin - Dashboard</title>

    <!-- Custom fonts for this template-->
    <link href="{% static 'assets/admin_vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">


    
    <!-- Custom styles for this template-->
    <link  href="{% static 'assets/css/sb-admin-2.css' %}"  rel="stylesheet">
    
    <!-- ZXing library for ticket scanning -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>

    <style>
        /* Active state for sidebar */
        .nav-item.active {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        /* Scanner styles from scan_ticket.html */
        .scanner-container { 
            max-width: 800px; 
            margin: 2rem auto; 
            text-align: center; 
        }
        #scanner {
            width: 100%;
            height: 400px;
            border: 2px solid #333;
            object-fit: cover;
            background: #1a1a1a;
        }
        .camera-controls {
            margin: 1rem 0;
        }
        .status-message {
            padding: 1rem;
            margin: 1rem 0;
            font-size: 1.2rem;
            border-radius: 4px;
        }
        .valid { background: #d4edda; color: #155724; }
        .invalid { background: #f8d7da; color: #721c24; }
        .scanning { color: #004085; background-color: #cce5ff; }
        .ticket-details {
            margin-top: 1rem;
            padding: 1rem;
            border: 1px dashed #ccc;
            border-radius: 4px;
        }
        
        /* Event management styles from manage_events.html */
        .category-form {
            border: 1px solid #dee2e6;
            padding: 1rem;
            margin-bottom: 1rem;
            position: relative;
        }
        .delete-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
        }
    </style>
</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Sidebar -->
        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">

            <!-- Sidebar - Brand -->
            <a class="sidebar-brand d-flex align-items-center justify-content-center" href="#">
                <div class="sidebar-brand-icon rotate-n-15">
                    <i class="fas fa-laugh-wink"></i>
                </div>
                <div class="sidebar-brand-text mx-3">Hello Admin!</div>
            </a>

            <!-- Divider -->
            <hr class="sidebar-divider my-0">
 
            <!-- Nav Items -->
            <li class="nav-item" data-content="manage-events">
                <a class="nav-link" href="#">
                    <i class="fas fa-fw fa-wrench"></i>
                    <span>Manage Events</span>
                </a>
            </li>

            <hr class="sidebar-divider">

            <li class="nav-item" data-content="scan-tickets">
                <a class="nav-link" href="#">
                    <i class="fas fa-fw fa-cog"></i>
                    <span>Scan Tickets</span>
                </a>
            </li>

            <hr class="sidebar-divider">

            <li class="nav-item" data-content="revenue">
                <a class="nav-link" href="#">
                    <i class="fas fa-fw fa-wallet"></i>
                    <span>Revenue</span>
                </a>
            </li>

            <hr class="sidebar-divider d-none d-md-block">

            <!-- Sidebar Toggler -->
            <div class="text-center d-none d-md-inline">
                <button class="rounded-circle border-0" id="sidebarToggle"></button>
            </div>

        </ul>
        <!-- End of Sidebar -->

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- Topbar -->
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                    <!-- Sidebar Toggle (Topbar) -->
                    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
                        <i class="fa fa-bars"></i>
                    </button>

                    <!-- Topbar Navbar -->
                    <ul class="navbar-nav ml-auto">
                        <!-- Nav Item - User Information -->
                        <li class="nav-item dropdown no-arrow">
                            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                <span class="mr-2 d-none d-lg-inline text-gray-600 small">Admin</span>
                                <img class="img-profile rounded-circle" src="{% static 'assets/img/undraw_profile.svg' %} ">
                            </a>
                            <!-- Dropdown - User Information -->
                            <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in" aria-labelledby="userDropdown">
                                <div class="dropdown-divider"></div>
                                <a class="dropdown-item" href="#" data-toggle="modal" data-target="#logoutModal">
                                    <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>
                                    Logout
                                </a>
                            </div>
                        </li>
                    </ul>
                </nav>
                <!-- End of Topbar -->

                <!-- Begin Page Content -->
                <div class="container-fluid" id="dynamic-content-container">
                    <!-- Content will be dynamically loaded here -->
                </div>
                <!-- End of Main Content -->
            </div>

            <!-- Footer -->
            <footer class="sticky-footer bg-white">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto">
                        <span>Copyright &copy; UGANDA–KENYA COAST TOURISM CONFERENCE 2025</span>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>

    <!-- Logout Modal-->
    <div class="modal fade" id="logoutModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Ready to Leave?</h5>
                    <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
                <div class="modal-body">Select "Logout" below if you are ready to end your current session.</div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="button" data-dismiss="modal">Cancel</button>
                    <a class="btn btn-primary" href="login.html">Logout</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="{% static 'assets/admin_vendor/jquery/jquery.min.js' %} "></script>
    <script src="{% static 'assets/admin_vendor/bootstrap/js/bootstrap.bundle.min.js' %} "></script>

    <!-- Core plugin JavaScript-->
    <script src="{% static ' assets/admin_vendor/jquery-easing/jquery.easing.min.js' %} "></script>

    <!-- Custom scripts for all pages-->
    <script src="{% static ' assets/admin_js/sb-admin-2.min.js' %} "></script>

    <!-- Page level plugins -->
    <script src="{% static 'assets/admin_vendor/chart.js/Chart.min.js ' %} "></script>

    <!-- Page level custom scripts -->
    <script src="{% static 'assets/admin_js/demo/chart-area-demo.js ' %} "></script>
    <script src="{% static 'assets/admin_js/demo/chart-pie-demo.js ' %} "></script>

    <script>
        $(document).ready(function() {
            // Scanner variables
            let codeReader;
            let currentScanner;
            let isScanningActive = true;
            
            // Set default content (Revenue)
            loadContent('revenue');
            setActiveNavItem('revenue');
            
            // Handle sidebar clicks
            $('.nav-item').click(function() {
                const contentId = $(this).data('content');
                loadContent(contentId);
                setActiveNavItem(contentId);
                
                // Initialize scanner when scan-tickets is selected
                if (contentId === 'scan-tickets' && !codeReader) {
                    initializeScanner();
                }
            });
            
            // Load content function
            function loadContent(contentId) {
                let contentHtml = '';
                
                switch(contentId) {
                    case 'manage-events':
                        contentHtml = `
                            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                                <h1 class="h3 mb-0 text-gray-800">Event Management</h1>
                                <button class="btn btn-primary" id="createEventBtn">+ Create New Event</button>
                            </div>
                            
                            <div id="eventsTableContainer">
                                <!-- Events table will be loaded here -->
                            </div>
                            
                            <div id="eventFormContainer" style="display:none;">
                                <!-- Event form will be loaded here -->
                            </div>
                        `;
                        break;
                        
                    case 'scan-tickets':
                        contentHtml = `
                            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                                <h1 class="h3 mb-0 text-gray-800">Ticket Scanner</h1>
                            </div>
                            
                            <div class="scanner-container">
                                <h2>🎟 Ticket Validation Scanner</h2>
                                <video id="scanner" playsinline autoplay></video>
                                <div class="camera-controls">
                                    <button id="switchCamera" style="display:none">Switch Camera</button>
                                    <button id="scanNext">Scan Another Ticket</button>
                                    <span id="cameraStatus">Initializing...</span>
                                </div>
                                <div id="result">
                                    <p class="status-message scanning">Waiting for camera...</p>
                                    <div class="ticket-details"></div>
                                </div>
                            </div>
                        `;
                        break;
                        
                    case 'revenue':
                        contentHtml = `
                            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                                <h1 class="h3 mb-0 text-gray-800">Revenue Summary</h1>
                            </div>

                            <div class="row">
                                <!-- Total Revenue -->
                                <div class="col-xl-3 col-md-6 mb-4">
                                    <div class="card border-left-primary shadow h-100 py-2">
                                        <div class="card-body">
                                            <div class="row no-gutters align-items-center">
                                                <div class="col mr-2">
                                                    <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                                        Total Revenue</div>
                                                    <div class="h5 mb-0 font-weight-bold text-gray-800">$40,000</div>
                                                </div>
                                                <div class="col-auto">
                                                    <i class="fas fa-dollar-sign fa-2x text-gray-300"></i>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Total Events -->
                                <div class="col-xl-3 col-md-6 mb-4">
                                    <div class="card border-left-success shadow h-100 py-2">
                                        <div class="card-body">
                                            <div class="row no-gutters align-items-center">
                                                <div class="col mr-2">
                                                    <div class="text-xs font-weight-bold text-success text-uppercase mb-1">
                                                        Upcoming Events</div>
                                                    <div class="h5 mb-0 font-weight-bold text-gray-800">3</div>
                                                </div>
                                                <div class="col-auto">
                                                    <i class="fas fa-clipboard-list fa-2x text-gray-300"></i>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Pending Requests Card Example -->
                                <div class="col-xl-3 col-md-6 mb-4">
                                    <div class="card border-left-warning shadow h-100 py-2">
                                        <div class="card-body">
                                            <div class="row no-gutters align-items-center">
                                                <div class="col mr-2">
                                                    <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">
                                                        Past events</div>
                                                    <div class="h5 mb-0 font-weight-bold text-gray-800">18</div>
                                                </div>
                                                <div class="col-auto">
                                                    <i class="fas fa-comments fa-2x text-gray-300"></i>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>                   

                            <div class="row">
                                <!-- Area Chart -->
                                <div class="col-xl-8 col-lg-7">
                                    <div class="card shadow mb-4">
                                        <!-- Card Header - Dropdown -->
                                        <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                                            <h6 class="m-0 font-weight-bold text-primary">Earnings Overview</h6>
                                        </div>
                                        <!-- Card Body -->
                                        <div class="card-body">
                                            <div class="chart-area">
                                                <canvas id="myAreaChart"></canvas>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        break;
                }
                
                $('#dynamic-content-container').html(contentHtml);
                
                // Load additional content if needed
                if (contentId === 'manage-events') {
                    loadEventsTable();
                    setupEventFormHandlers();
                }
            }
            
            // Set active nav item
            function setActiveNavItem(contentId) {
                $('.nav-item').removeClass('active');
                $(`.nav-item[data-content="${contentId}"]`).addClass('active');
            }
            
            // Initialize scanner
            function initializeScanner() {
                codeReader = new ZXing.BrowserQRCodeReader();
                const statusEl = $('.status-message');
                const videoEl = $('#scanner')[0];
                const scanNextBtn = $('#scanNext');
                const ticketDetailsEl = $('.ticket-details');
                
                // Scanner logic from scan_ticket.html
                async function startScanner() {
                    statusEl.text("Starting camera...").removeClass().addClass("status-message scanning");
                    ticketDetailsEl.empty();
                    scanNextBtn.hide();
                    isScanningActive = true;
                
                    try {
                        currentScanner = await codeReader.decodeFromVideoDevice(
                            undefined,
                            videoEl,
                            async (result, error) => {
                                if (result && isScanningActive) {
                                    isScanningActive = false;
                                    statusEl.text("🔍 Validating ticket...");
                                    await validateAndMarkTicket(result.text);
                                }
                                if (error && !error.message.includes('No QR code')) {
                                    console.warn("Scanner quirk:", error);
                                }
                            }
                        );
                        statusEl.text("Ready to scan 🎥");
                    } catch (error) {
                        handleCameraError(error);
                    }
                }
                
                async function validateAndMarkTicket(ticketCode) {
                    try {
                        const response = await fetch(`/api/validate-ticket/?code=${encodeURIComponent(ticketCode)}&mark_used=true`);
                        const result = await response.json();
                
                        if (result.valid) {
                            displayTicketInfo(result.ticket);
                            statusEl.text(result.message);
                            statusEl.removeClass().addClass("status-message " + (result.ticket.is_used ? "invalid" : "valid"));
                            
                            if (!result.ticket.is_used) {
                                setTimeout(() => {
                                    if (scanNextBtn.css('display') === 'none') {
                                        resumeScanning();
                                    }
                                }, 2000);
                            }
                        } else {
                            statusEl.text(result.message).removeClass().addClass("status-message invalid");
                        }
                    } catch (error) {
                        statusEl.text("⚠️ Network error. Try again.").removeClass().addClass("status-message invalid");
                    } finally {
                        scanNextBtn.show();
                    }
                }
                
                function displayTicketInfo(ticket) {
                    const statusText = ticket.first_scanned_at 
                        ? `USED ✅ (Scanned on ${ticket.first_scanned_at})`
                        : "NEW";
                
                    ticketDetailsEl.html(`
                        <h3>${ticket.event_name}</h3>
                        <p><strong>When:</strong> ${ticket.event_date}</p>
                        <p><strong>Where:</strong> ${ticket.location}</p>
                        <hr>
                        <p><strong>Ticket ID:</strong> ${ticket.ticket_id}</p>
                        <p><strong>Holder:</strong> ${ticket.holder_name}</p>
                        <p><strong>Contact:</strong> ${ticket.holder_email} | ${ticket.holder_phone || 'N/A'}</p>
                        <p><strong>Status:</strong> ${statusText}</p>
                    `);
                }
                
                function resumeScanning() {
                    isScanningActive = true;
                    statusEl.text("Ready to scan 🎥").removeClass().addClass("status-message scanning");
                    ticketDetailsEl.empty();
                    scanNextBtn.hide();
                }
                
                function handleCameraError(error) {
                    if (error.name === 'NotAllowedError') {
                        statusEl.text("❌ Camera access denied").removeClass().addClass("status-message invalid");
                    } else {
                        console.warn("Camera warning:", error);
                        statusEl.text("Ready to scan 🎥").removeClass().addClass("status-message scanning");
                    }
                }
                
                scanNextBtn.click(resumeScanning);
                startScanner();
            }
            
            // Load events table (would be replaced with actual AJAX call)
            function loadEventsTable() {
                $('#eventsTableContainer').html(`
                    <table class="table table-bordered table-striped bg-white">
      <thead>
        <tr>
          <th>Poster</th>
          <th>Name</th>
          <th>Location</th>
          <th>Date</th>
          <th>Categories</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for event in events %}
        <tr>
          <td><img src="{{ event.poster.url }}" width="80"></td>
          <td>{{ event.name }}</td>
          <td>{{ event.location }}</td>
          <td>{{ event.date|date:"M d, Y H:i" }}</td>
          <td>
            {% for category in event.categories.all %}
              <div>
                <strong>{{ category.name }}</strong><br>
                Price: Ksh{{ category.price }}<br>
                Available: {{ category.available_tickets }}<br>
                Remaining: {{ category.remaining_tickets }}<br>
                <hr>
              </div>
            {% empty %}
              <em>No categories yet</em>
            {% endfor %}
          </td>
          <td>
            <a href="?edit={{ event.id }}" class="btn btn-sm btn-warning">Edit</a>
            <form method="post" action="{% url 'delete_event' event.id %}" style="display:inline;">
              {% csrf_token %}
              <button class="btn btn-sm btn-danger" onclick="return confirm('Delete this event?')">Delete</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
                `);
            }
            
            // Setup event form handlers
            function setupEventFormHandlers() {
                // Show form when create button clicked
                $('#createEventBtn').click(function() {
                    $('#eventsTableContainer').hide();
                    $('#eventFormContainer').show().html(`
                        <div class="card mb-5">
                            <div class="card-header bg-primary text-white">
                                Create New Event
                            </div>
                            <div class="card-body">
                                <form id="eventForm">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label>Event Name</label>
                                            <input type="text" class="form-control" name="name" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label>Location</label>
                                            <input type="text" class="form-control" name="location" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label>Date</label>
                                            <input type="datetime-local" class="form-control" name="date" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label>Poster</label>
                                            <input type="file" class="form-control" name="poster">
                                        </div>
                                        <div class="col-md-12">
                                            <label>Description</label>
                                            <textarea class="form-control" name="description" rows="3"></textarea>
                                        </div>
                                    </div>

                                    <hr>
                                    <h5 class="mt-4">Add Ticket Categories</h5>
                                    <div id="categories">
                                        <div class="category-form border p-3 mb-3 position-relative">
                                            <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0 m-2 delete-btn">&times;</button>
                                            <div class="row">
                                                <div class="col-md-4">
                                                    <label>Category Name</label>
                                                    <input type="text" class="form-control" name="categories[0][name]" required>
                                                </div>
                                                <div class="col-md-4">
                                                    <label>Price</label>
                                                    <input type="number" class="form-control" name="categories[0][price]" required>
                                                </div>
                                                <div class="col-md-4">
                                                    <label>Available Tickets</label>
                                                    <input type="number" class="form-control" name="categories[0][available_tickets]" required>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <button type="button" class="btn btn-outline-secondary mt-2" id="addCategoryBtn">+ Add Another Category</button>

                                    <button type="submit" class="btn btn-success mt-4">Save Event</button>
                                    <button type="button" class="btn btn-secondary mt-4" id="cancelForm">Cancel</button>
                                </form>
                            </div>
                        </div>
                    `);
                    
                    // Setup form controls
                    setupCategoryFormControls();
                    
                    // Cancel button handler
                    $('#cancelForm').click(function() {
                        $('#eventFormContainer').hide();
                        $('#eventsTableContainer').show();
                    });
                });
            }
            
            // Setup category form controls
            function setupCategoryFormControls() {
                let categoryCount = 1;
                
                $('#addCategoryBtn').click(function() {
                    const newCategory = `
                        <div class="category-form border p-3 mb-3 position-relative">
                            <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0 m-2 delete-btn">&times;</button>
                            <div class="row">
                                <div class="col-md-4">
                                    <label>Category Name</label>
                                    <input type="text" class="form-control" name="categories[${categoryCount}][name]" required>
                                </div>
                                <div class="col-md-4">
                                    <label>Price</label>
                                    <input type="number" class="form-control" name="categories[${categoryCount}][price]" required>
                                </div>
                                <div class="col-md-4">
                                    <label>Available Tickets</label>
                                    <input type="number" class="form-control" name="categories[${categoryCount}][available_tickets]" required>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    $('#categories').append(newCategory);
                    categoryCount++;
                    
                    // Add delete handler for new category
                    $('.delete-btn').off('click').click(function() {
                        if ($('.category-form').length > 1) {
                            $(this).closest('.category-form').remove();
                        }
                    });
                });
                
                // Initial delete button handler
                $('.delete-btn').click(function() {
                    if ($('.category-form').length > 1) {
                        $(this).closest('.category-form').remove();
                    }
                });
            }
        });
    </script>
</body>
</html>
